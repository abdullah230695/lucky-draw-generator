<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Draw</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   THEME SYSTEM
══════════════════════════════════════ */
:root{
  --gold:#F5C842;--gold-light:#FFE27A;--gold-dark:#C8A000;
  --dark:#0D0D0D;--card:#161616;--card2:#1E1E1E;
  --border:#2A2A2A;--text:#E8E8E8;--muted:#666;--red:#FF4D4D;
  --accent1:var(--gold);--accent2:var(--gold-light);--accent3:var(--gold-dark);
  --glow:rgba(245,200,66,.25);
}
[data-theme="neon"]{
  --gold:#00F5FF;--gold-light:#80FFFF;--gold-dark:#00B8C8;
  --dark:#050510;--card:#0A0A20;--card2:#0F0F28;
  --border:#1A1A40;--text:#E0F0FF;--muted:#446;
  --glow:rgba(0,245,255,.25);
}
[data-theme="festival"]{
  --gold:#FF3D5A;--gold-light:#FF8095;--gold-dark:#CC1A35;
  --dark:#0D0005;--card:#1A0008;--card2:#220010;
  --border:#3A0018;--text:#FFE8EC;--muted:#884;
  --glow:rgba(255,61,90,.25);
}
[data-theme="royal"]{
  --gold:#A855F7;--gold-light:#D8B4FE;--gold-dark:#7C3AED;
  --dark:#07030F;--card:#100820;--card2:#160B2A;
  --border:#2A1550;--text:#EDE9FE;--muted:#664;
  --glow:rgba(168,85,247,.25);
}

/* ══════════════════════════════════════
   BASE
══════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 80px;
  transition:background .4s,color .4s;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");}
.container{width:100%;max-width:660px;position:relative;z-index:1;}

/* header */
header{text-align:center;margin-bottom:40px;}
.star-row{display:flex;justify-content:center;gap:8px;margin-bottom:12px;}
.star{width:8px;height:8px;background:var(--gold);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  animation:twinkle 2s ease-in-out infinite;}
.star:nth-child(2){animation-delay:.4s}.star:nth-child(3){animation-delay:.8s}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,12vw,84px);letter-spacing:4px;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 40%,var(--gold-dark) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.subtitle{color:var(--muted);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-top:8px;}

/* ── THEME SWITCHER ── */
.theme-bar{display:flex;justify-content:center;gap:10px;margin-bottom:28px;flex-wrap:wrap;}
.theme-btn{
  padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);
  background:var(--card2);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;
  letter-spacing:1px;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:6px;
}
.theme-btn:hover{border-color:var(--gold);color:var(--gold);}
.theme-btn.active{border-color:var(--gold);background:rgba(245,200,66,.08);color:var(--gold);font-weight:600;}
.theme-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px;transition:background .4s,border-color .4s;}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--gold);
  margin-bottom:20px;display:flex;align-items:center;gap:8px;}
.card-title svg{width:18px;height:18px;flex-shrink:0;}

/* name rows */
.names-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.name-row{display:flex;gap:10px;align-items:center;animation:slideIn .25s ease;}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
.name-number{width:28px;height:28px;background:var(--card2);border:1px solid var(--border);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--muted);flex-shrink:0;font-weight:600;}
input[type="text"],textarea{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;
  transition:border-color .2s;outline:none;}
input[type="text"]:focus,textarea:focus{border-color:var(--gold);}
input[type="text"]::placeholder,textarea::placeholder{color:var(--muted);}
textarea{width:100%;resize:vertical;min-height:110px;line-height:1.6;}
.btn-remove{width:32px;height:32px;background:transparent;border:1px solid var(--border);
  border-radius:8px;color:var(--muted);cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:all .2s;font-size:16px;}
.btn-remove:hover{background:#2A1A1A;border-color:var(--red);color:var(--red);}

/* row of small buttons */
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}
.btn-sm{flex:1;min-width:110px;background:transparent;border:1px dashed var(--border);border-radius:10px;
  padding:9px 10px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;
  cursor:pointer;transition:all .2s;letter-spacing:.5px;text-align:center;}
.btn-sm:hover{border-color:var(--gold);color:var(--gold);background:rgba(245,200,66,.04);}
.btn-sm.solid{background:var(--card2);border-style:solid;}

/* import area */
.import-area{display:none;margin-top:12px;}
.import-area.open{display:block;animation:fadeUp .2s ease;}
.import-hint{font-size:12px;color:var(--muted);margin-bottom:8px;}
.import-actions{display:flex;gap:8px;margin-top:8px;}
.btn-import-ok{flex:1;background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  border:none;border-radius:8px;padding:9px;font-family:'Bebas Neue',sans-serif;
  font-size:14px;letter-spacing:2px;color:var(--dark);cursor:pointer;}
.btn-import-cancel{flex:1;background:transparent;border:1px solid var(--border);border-radius:8px;
  padding:9px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;}

/* draw count */
.draw-row{display:flex;align-items:center;gap:16px;}
.draw-label{font-size:14px;color:var(--muted);flex:1;}
.draw-stepper{display:flex;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.step-btn{width:40px;height:44px;background:transparent;border:none;color:var(--text);font-size:18px;cursor:pointer;transition:background .15s;}
.step-btn:hover{background:rgba(245,200,66,.1);color:var(--gold);}
.draw-count-display{min-width:60px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:28px;
  color:var(--gold);letter-spacing:2px;border-left:1px solid var(--border);
  border-right:1px solid var(--border);padding:0 8px;line-height:44px;}

/* run / reset */
.btn-run{width:100%;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  border:none;border-radius:14px;padding:18px;font-family:'Bebas Neue',sans-serif;
  font-size:22px;letter-spacing:3px;color:var(--dark);cursor:pointer;
  transition:all .25s;position:relative;overflow:hidden;margin-top:4px;}
.btn-run::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 60%);}
.btn-run:hover{transform:translateY(-2px);box-shadow:0 8px 32px var(--glow);}
.btn-run:active{transform:translateY(0);}
.btn-run:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.error-msg{background:rgba(255,77,77,.1);border:1px solid rgba(255,77,77,.3);border-radius:10px;
  padding:12px 16px;color:var(--red);font-size:13px;margin-top:12px;display:none;}

/* results */
.results-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:28px;display:none;animation:fadeUp .4s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.results-meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.meta-chip{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--muted);letter-spacing:1px;}
.meta-chip strong{color:var(--text);font-size:15px;display:block;margin-top:2px;}
.result-row{display:flex;align-items:center;gap:14px;padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.04);animation:rowIn .3s ease both;}
.result-row:last-child{border-bottom:none;}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.rank-badge{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;
  flex-shrink:0;background:var(--card2);border:1px solid var(--border);color:var(--muted);}
.rank-badge.rank-1{background:linear-gradient(135deg,var(--gold-dark),var(--gold));border-color:var(--gold);color:var(--dark);}
.result-name{flex:1;font-size:15px;font-weight:500;}
.result-bar-wrap{flex:2;height:6px;background:var(--card2);border-radius:3px;overflow:hidden;}
.result-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:3px;transition:width .8s cubic-bezier(.16,1,.3,1);}
.result-count{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold);letter-spacing:1px;min-width:36px;text-align:right;}
.result-pct{font-size:11px;color:var(--muted);min-width:38px;text-align:right;}
.zero-count .result-name,.zero-count .result-count{color:var(--muted);}
.winner-banner{background:linear-gradient(135deg,rgba(245,200,66,.12),rgba(245,200,66,.03));
  border:1px solid rgba(245,200,66,.3);border-radius:12px;padding:16px 20px;
  margin-bottom:20px;display:flex;align-items:center;gap:12px;}
.trophy{font-size:28px;}
.winner-label{font-size:11px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;}
.winner-name{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--text);line-height:1.1;}

/* export bar */
.export-bar{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
.btn-export{flex:1;min-width:100px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px 10px;
  font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:.5px;color:var(--muted);
  cursor:pointer;transition:all .2s;}
.btn-export:hover{border-color:var(--gold);color:var(--gold);}
.btn-export svg{width:14px;height:14px;flex-shrink:0;}
.btn-reset{width:100%;background:transparent;border:1px solid var(--border);border-radius:12px;
  padding:13px;font-family:'DM Sans',sans-serif;font-size:13px;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);cursor:pointer;margin-top:10px;transition:all .2s;}
.btn-reset:hover{border-color:var(--muted);color:var(--text);}

/* ── HISTORY PANEL ── */
.history-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px;}
.history-empty{text-align:center;color:var(--muted);font-size:13px;padding:20px 0;}
.hist-item{display:flex;gap:14px;align-items:center;padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:opacity .15s;}
.hist-item:last-child{border-bottom:none;}
.hist-item:hover{opacity:.8;}
.hist-num{width:32px;height:32px;border-radius:8px;background:var(--card2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;
  font-size:14px;color:var(--muted);flex-shrink:0;}
.hist-info{flex:1;}
.hist-winner{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;color:var(--gold);}
.hist-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.hist-badge{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--muted);letter-spacing:1px;}
.btn-clear-hist{background:transparent;border:none;color:var(--muted);font-size:12px;
  cursor:pointer;letter-spacing:1px;margin-left:auto;padding:4px 8px;
  transition:color .2s;text-transform:uppercase;}
.btn-clear-hist:hover{color:var(--red);}
.hist-title-row{display:flex;align-items:center;margin-bottom:16px;}
.hist-title-row .card-title{margin-bottom:0;flex:1;}

/* ════════════════════════════════
   DRAW OVERLAY
════════════════════════════════ */
#drawOverlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.93);backdrop-filter:blur(14px);
  flex-direction:column;align-items:center;justify-content:center;gap:26px;
}
#drawOverlay.show{display:flex;}
.ov-title{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:5px;color:var(--muted);}
.drum-wrap{
  width:min(420px,88vw);height:120px;position:relative;
  border-radius:18px;overflow:hidden;
  border:2px solid rgba(245,200,66,.3);
  background:linear-gradient(180deg,#050505 0%,#111 28%,#111 72%,#050505 100%);
  box-shadow:0 0 60px var(--glow),inset 0 0 40px rgba(0,0,0,.7);
}
.drum-wrap::before,.drum-wrap::after{content:'';position:absolute;left:0;right:0;height:42px;z-index:3;pointer-events:none;}
.drum-wrap::before{top:0;background:linear-gradient(to bottom,#060606,transparent);}
.drum-wrap::after{bottom:0;background:linear-gradient(to top,#060606,transparent);}
.drum-line{position:absolute;left:0;right:0;height:2px;z-index:4;
  background:linear-gradient(90deg,transparent,var(--gold) 25%,var(--gold) 75%,transparent);opacity:.5;}
.drum-line.t{top:38px;}.drum-line.b{bottom:38px;}
#drumStrip{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;will-change:transform;}
.drum-item{height:120px;width:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:3px;
  color:#999;flex-shrink:0;padding:0 16px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;}
.drum-item.lit{color:var(--gold);text-shadow:0 0 28px var(--glow);}
.ov-counter{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:3px;color:var(--muted);}
.ov-counter em{color:var(--gold);font-style:normal;font-size:18px;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:380px;}
.pill{background:var(--card2);border:1px solid var(--border);border-radius:20px;
  padding:5px 13px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;
  color:var(--muted);transition:all .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;}
.pill.won{background:rgba(245,200,66,.15);border-color:var(--gold);color:var(--gold);transform:scale(1.1);}
.pill.pop{background:var(--gold);color:var(--dark);transform:scale(1.22);}

/* ════════════════════════════════
   WINNER REVEAL
════════════════════════════════ */
#revealScreen{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.96);
  flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
#revealScreen.show{display:flex;animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.rv-crown{font-size:68px;animation:zpop .6s cubic-bezier(.34,1.56,.64,1);}
.rv-label{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:5px;color:var(--muted);}
.rv-name{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,9vw,68px);
  letter-spacing:4px;text-align:center;padding:0 20px;
  background:linear-gradient(135deg,var(--gold),var(--gold-light),var(--gold-dark));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:zpop .5s cubic-bezier(.34,1.56,.64,1) .15s both;
}
.rv-sub{font-size:14px;color:var(--muted);}
.rv-btn{margin-top:16px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  border:none;border-radius:12px;padding:14px 44px;font-family:'Bebas Neue',sans-serif;
  font-size:18px;letter-spacing:3px;color:var(--dark);cursor:pointer;transition:all .2s;
  animation:zpop .4s cubic-bezier(.34,1.56,.64,1) .4s both;}
.rv-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px var(--glow);}
@keyframes zpop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

/* toast */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:11px 20px;font-size:13px;color:var(--text);z-index:500;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* confetti canvas */
#fx{position:fixed;inset:0;pointer-events:none;z-index:400;}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>

<!-- DRAW OVERLAY -->
<div id="drawOverlay">
  <div class="ov-title">🎰 Lucky Draw in Progress</div>
  <div class="drum-wrap">
    <div class="drum-line t"></div>
    <div class="drum-line b"></div>
    <div id="drumStrip"></div>
  </div>
  <div class="ov-counter">Draw <em id="ovCur">1</em> of <em id="ovTotal">3</em></div>
  <div class="pill-row" id="pillRow"></div>
</div>

<!-- WINNER REVEAL -->
<div id="revealScreen">
  <div class="rv-crown">🏆</div>
  <div class="rv-label">Most Drawn Winner</div>
  <div class="rv-name" id="rvName"></div>
  <div class="rv-sub"  id="rvSub"></div>
  <button class="rv-btn" id="rvBtn">See Full Results →</button>
</div>

<!-- MAIN UI -->
<div class="container">
  <header>
    <div class="star-row"><div class="star"></div><div class="star"></div><div class="star"></div></div>
    <h1>Lucky Draw</h1>
    <p class="subtitle">Enter names · Set draws · Spin the wheel</p>
  </header>

  <!-- THEME SWITCHER -->
  <div class="theme-bar">
    <button class="theme-btn active" data-theme="default">
      <span class="theme-dot" style="background:#F5C842"></span>Casino Gold
    </button>
    <button class="theme-btn" data-theme="neon">
      <span class="theme-dot" style="background:#00F5FF"></span>Neon Blue
    </button>
    <button class="theme-btn" data-theme="festival">
      <span class="theme-dot" style="background:#FF3D5A"></span>Festival Red
    </button>
    <button class="theme-btn" data-theme="royal">
      <span class="theme-dot" style="background:#A855F7"></span>Dark Royal
    </button>
  </div>

  <!-- PARTICIPANTS -->
  <div class="card">
    <div class="card-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Participants
    </div>
    <div class="names-list" id="namesList"></div>
    <div class="btn-row" style="margin-bottom:0">
      <button class="btn-sm" id="addBtn">+ Add Name</button>
      <button class="btn-sm solid" id="importToggleBtn">📋 Paste Names</button>
    </div>
    <!-- IMPORT AREA -->
    <div class="import-area" id="importArea">
      <p class="import-hint" style="margin-top:12px">One name per line. They will replace the current list.</p>
      <textarea id="importTa" placeholder="Abdullah&#10;Rahman&#10;Sadiq&#10;Ameen&#10;Fathima"></textarea>
      <div class="import-actions">
        <button class="btn-import-ok" id="importOkBtn">Import</button>
        <button class="btn-import-cancel" id="importCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- DRAW COUNT -->
  <div class="card">
    <div class="card-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      Number of Draws

    <!-- EXPORT -->

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy List
      </button>
      <button class="btn-export" id="btnScreenshot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/></svg>
        Screenshot
      </button>
      <button class="btn-export" id="btnPDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Download PDF

  <!-- HISTORY -->

    <div class="hist-title-row">
      <div class="card-title" style="margin-bottom:0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/>
        </svg>
        Draw History
      </div>
      <button class="btn-clear-hist" id="clearHistBtn">Clear All</button>

    <div id="histList"></div>

</div><!-- /container -->

<script>
/* ════════════════════════════════════════
   HELPERS
════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function showToast(msg, ms=2200){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), ms);
}

/* ════════════════════════════════════════
   THEME
════════════════════════════════════════ */
const themeMap={default:'Casino Gold',neon:'Neon Blue',festival:'Festival Red',royal:'Dark Royal'};
let currentTheme = localStorage.getItem('ld_theme')||'default';
applyTheme(currentTheme);

function applyTheme(t){
  currentTheme=t;
  document.body.setAttribute('data-theme', t==='default'?'':t);
  localStorage.setItem('ld_theme',t);
  document.querySelectorAll('.theme-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.theme===t);
  });
}
document.querySelectorAll('.theme-btn').forEach(b=>{
  b.onclick=()=>applyTheme(b.dataset.theme);
});

/* ════════════════════════════════════════
   NAME ROWS
════════════════════════════════════════ */
const namesList=$('namesList');
['Alice','Bob','Charlie','Diana','Eve'].forEach(addRow);
$('addBtn').onclick=()=>{ addRow(''); namesList.lastElementChild.querySelector('input').focus(); };

function addRow(val){
  const d=document.createElement('div');
  d.className='name-row';
  const esc=String(val).replace(/"/g,'&quot;');
  d.innerHTML=`<div class="name-number">${namesList.children.length+1}</div>
    <input type="text" placeholder="Enter name..." value="${esc}" maxlength="50">
    <button class="btn-remove">×</button>`;
  d.querySelector('.btn-remove').onclick=()=>{
    Object.assign(d.style,{transition:'all .2s',opacity:'0',transform:'translateX(12px)'});
    setTimeout(()=>{d.remove();reindex();},200);
  };
  namesList.appendChild(d);
}
function reindex(){
  [...namesList.querySelectorAll('.name-number')].forEach((el,i)=>el.textContent=i+1);
}

/* ════════════════════════════════════════
   NAME IMPORT
════════════════════════════════════════ */
$('importToggleBtn').onclick=()=>{
  const a=$('importArea');
  a.classList.toggle('open');
  if(a.classList.contains('open')) $('importTa').focus();
};
$('importCancelBtn').onclick=()=>{ $('importArea').classList.remove('open'); };
$('importOkBtn').onclick=()=>{
  const lines=$('importTa').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length){showToast('⚠️ Nothing to import');return;}
  namesList.innerHTML='';
  lines.forEach(addRow);
  $('importTa').value='';
  $('importArea').classList.remove('open');
  showToast(`✅ Imported ${lines.length} name${lines.length>1?'s':''}`);
};

/* ════════════════════════════════════════
   DRAW COUNT
════════════════════════════════════════ */
let drawCount=3;
$('stepDn').onclick=()=>{if(drawCount>1){drawCount--;$('drawDisp').textContent=drawCount;}};
$('stepUp').onclick=()=>{if(drawCount<999){drawCount++;$('drawDisp').textContent=drawCount;}};

/* ════════════════════════════════════════
   CONFETTI
════════════════════════════════════════ */
const cvs=$('fx'),cx=cvs.getContext('2d');
let pts=[],rafFx=null;
function resizeCvs(){cvs.width=innerWidth;cvs.height=innerHeight;}
resizeCvs(); window.addEventListener('resize',resizeCvs);
const COLS=['#F5C842','#FFE27A','#FF4D4D','#4DFF91','#4D9FFF','#fff'];

function burst(x,y,n=28){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,spd=3+Math.random()*7;
    pts.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,
      w:4+Math.random()*7,h:3+Math.random()*5,
      c:COLS[0|Math.random()*COLS.length],
      life:1,dec:.014+Math.random()*.02,
      rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.25});
  }
  runFx();
}
function shower(){for(let i=0;i<100;i++)setTimeout(()=>burst(Math.random()*innerWidth,-8,5),i*16);}
function runFx(){
  if(rafFx)cancelAnimationFrame(rafFx);
  (function loop(){
    cx.clearRect(0,0,cvs.width,cvs.height);
    pts=pts.filter(p=>p.life>0);
    pts.forEach(p=>{
      cx.save();cx.globalAlpha=p.life;cx.fillStyle=p.c;
      cx.translate(p.x,p.y);cx.rotate(p.rot);
      cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      cx.restore();
      p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.rot+=p.rv;p.life-=p.dec;
    });
    if(pts.length){rafFx=requestAnimationFrame(loop);}
    else{cx.clearRect(0,0,cvs.width,cvs.height);}
  })();
}

/* ════════════════════════════════════════
   SOUND ENGINE
════════════════════════════════════════ */
let AC=null;
function getAC(){
  if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function vibrateSafe(p){try{if(navigator.vibrate&&window.isSecureContext)navigator.vibrate(p);}catch(e){}}
function tone(freq,type='sine',vol=0.18,dur=0.08,delay=0){
  const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.value=freq;
  const t=ac.currentTime+delay;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t);o.stop(t+dur+.02);
}
let tickTimer=null;
function startSpinSound(durationMs){
  stopSpinSound();
  let elapsed=0;
  function tick(){
    const progress=Math.min(elapsed/durationMs,1);
    const slow=progress<.70?0:(progress-.70)/.30;
    const interval=26+Math.round(slow*slow*190);
    const pitch=260+(1-slow)*320+Math.random()*30;
    tone(pitch,'square',.06,.018);
    elapsed+=interval;
    if(elapsed<durationMs-80)tickTimer=setTimeout(tick,interval);
  }
  tick();
}
function stopSpinSound(){if(tickTimer){clearTimeout(tickTimer);tickTimer=null;}}
function playLandSound(){
  const ac=getAC();
  const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*.14),ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){const t=i/ac.sampleRate;d[i]=Math.sin(2*Math.PI*75*t*Math.exp(-t*28))*Math.exp(-t*20)*.95;}
  const src=ac.createBufferSource();src.buffer=buf;
  const g=ac.createGain();g.gain.value=.85;
  src.connect(g);g.connect(ac.destination);src.start();
  tone(900,'sine',.20,.13);tone(1350,'sine',.09,.09,.03);
}
function playBurstSound(){[480,700,940,1180].forEach((f,i)=>tone(f,'sine',.10,.09,i*.032));}
function playFanfare(){
  [523,659,784,1047,1319].forEach((f,i)=>{tone(f,'sine',.22,.32,i*.085);tone(f*2,'sine',.05,.18,i*.085+.04);});
  [523,659,784,1047].forEach(f=>tone(f,'sine',.10,.65,.52));
}
function playConfettiSound(){for(let i=0;i<14;i++)tone(500+Math.random()*1400,'sine',.055,.065,i*.038);}

/* ════════════════════════════════════════
   VOICE ANNOUNCEMENT
════════════════════════════════════════ */
function announceWinner(name){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(`The winner is... ${name}!`);
  u.rate=0.92; u.pitch=1.1; u.volume=1;
  // Try to pick a natural voice
  const voices=window.speechSynthesis.getVoices();
  const preferred=voices.find(v=>v.lang.startsWith('en')&&!v.name.includes('Google'))||voices[0];
  if(preferred)u.voice=preferred;
  window.speechSynthesis.speak(u);
}
// Pre-load voices (required for some browsers)
if('speechSynthesis' in window) window.speechSynthesis.getVoices();

/* ════════════════════════════════════════
   SLOT DRUM
════════════════════════════════════════ */
const ITEM_H=120;

function buildStrip(names,winner){
  const strip=$('drumStrip');
  strip.innerHTML='';strip.style.transform='translateY(0px)';
  const TOTAL=Math.max(names.length*10,60);
  const items=[];
  for(let i=0;i<TOTAL;i++)items.push(names[0|Math.random()*names.length]);
  const landIdx=Math.floor(TOTAL*.82);
  items[landIdx]=winner;
  items.forEach(name=>{
    const el=document.createElement('div');
    el.className='drum-item';el.textContent=name;
    strip.appendChild(el);
  });
  return{strip,landIdx};
}

function animateStrip(strip,targetY,durationMs){
  return new Promise(resolve=>{
    const t0=performance.now();
    function ease(t){const c=1-t;return 1-c*c*c;}
    (function frame(now){
      const t=Math.min((now-t0)/durationMs,1);
      strip.style.transform=`translateY(${targetY*ease(t)}px)`;
      if(t<1)requestAnimationFrame(frame);
      else{strip.style.transform=`translateY(${targetY}px)`;resolve();}
    })(performance.now());
  });
}

async function spinOnce(names,winner,drawIdx){
  $('ovCur').textContent=drawIdx+1;
  const{strip,landIdx}=buildStrip(names,winner);
  await new Promise(r=>requestAnimationFrame(r));
  await new Promise(r=>requestAnimationFrame(r));
  const targetY=-(landIdx*ITEM_H);
  const dur=1400+drawIdx*180;
  await animateStrip(strip,targetY,dur);
  strip.children[landIdx].classList.add('lit');
}

/* ════════════════════════════════════════
   MAIN DRAW
════════════════════════════════════════ */
let savedResults=null;

async function runDraw(names,total){
  const tally={};
  names.forEach(n=>tally[n]=0);
  const seq=Array.from({length:total},()=>{
    const w=names[0|Math.random()*names.length];tally[w]++;return w;
  });

  $('pillRow').innerHTML='';$('ovTotal').textContent=total;
  const pills=seq.map((_,i)=>{
    const p=document.createElement('div');
    p.className='pill';p.textContent=`Draw ${i+1}`;
    $('pillRow').appendChild(p);return p;
  });

  $('drawOverlay').classList.add('show');

  for(let i=0;i<total;i++){
    const spinMs=1400+i*180;
    startSpinSound(spinMs);
    await spinOnce(names,seq[i],i);
    stopSpinSound();
    playLandSound();
    vibrateSafe([80,40,120]);
    const drum=document.querySelector('.drum-wrap');
    const r=drum.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,28);
    playBurstSound();
    pills[i].classList.add('pop');
    await sleep(150);
    pills[i].classList.remove('pop');
    pills[i].classList.add('won');
    pills[i].textContent=seq[i];
    await sleep(380);
  }

  $('drawOverlay').classList.remove('show');

  savedResults={tally,names,total};
  const sorted=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  const maxWins=sorted[0][1];
  const winners=sorted.filter(([,v])=>v===maxWins).map(([n])=>n);
  const winnerStr=winners.join(' & ');

  $('rvName').textContent=winnerStr;
  $('rvSub').textContent=`${maxWins} win${maxWins!==1?'s':''} out of ${total} draw${total!==1?'s':''}`;
  $('revealScreen').classList.add('show');
  playFanfare();
  setTimeout(playConfettiSound,300);
  vibrateSafe([220,100,280,100,380]);
  shower();

  // Voice announcement (delayed slightly for drama)
  setTimeout(()=>announceWinner(winnerStr), 800);

  // Save to history
  saveHistory({winner:winnerStr,participants:names.length,draws:total,date:new Date().toISOString()});
}

$('rvBtn').onclick=()=>{
  $('revealScreen').classList.remove('show');
  pts=[];cx.clearRect(0,0,cvs.width,cvs.height);
  if(savedResults)showResults(savedResults);
};

/* ════════════════════════════════════════
   RESULTS TABLE
════════════════════════════════════════ */
function showResults({tally,names,total}){
  const sorted=Object.entries(tally).sort((a,b)=>a[1]-b[1]);
  const maxWins=Math.max(...Object.values(tally));
  const topNames=sorted.filter(([,v])=>v===maxWins).map(([n])=>n).join(', ');

  $('resMeta').innerHTML=`
    <div class="meta-chip">Participants<strong>${names.length}</strong></div>
    <div class="meta-chip">Total Draws<strong>${total}</strong></div>
    <div class="meta-chip">Most Wins<strong>${maxWins}</strong></div>`;

  $('resBanner').innerHTML=`
    <div class="trophy">🏆</div>
    <div><div class="winner-label">Most Drawn</div>
    <div class="winner-name">${topNames}</div></div>`;

  const list=$('resList');list.innerHTML='';
  sorted.forEach(([name,wins],idx)=>{
    const pct=total>0?((wins/total)*100).toFixed(1):0;
    const barW=maxWins>0?(wins/maxWins)*100:0;
    const isTop=wins===maxWins;
    const row=document.createElement('div');
    row.className='result-row'+(wins===0?' zero-count':'');
    row.style.animationDelay=`${idx*.07}s`;
    row.innerHTML=`
      <div class="rank-badge ${isTop?'rank-1':''}">${idx+1}</div>
      <div class="result-name">${name}</div>
      <div class="result-bar-wrap"><div class="result-bar" style="width:0" data-w="${barW}"></div></div>
      <div class="result-pct">${pct}%</div>
      <div class="result-count">${wins}</div>`;
    list.appendChild(row);
  });

  const card=$('resultsCard');
  card.style.display='block';
  card.scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(()=>{
    list.querySelectorAll('.result-bar').forEach(b=>b.style.width=b.dataset.w+'%');
  },120);
}

/* ════════════════════════════════════════
   EXPORT
════════════════════════════════════════ */
$('btnCopyList').onclick=()=>{
  if(!savedResults){showToast('Run a draw first');return;}
  const{tally,total}=savedResults;
  const sorted=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  const maxWins=Math.max(...Object.values(tally));
  const lines=[
    `Lucky Draw Results`,
    `Date: ${new Date().toLocaleString()}`,
    `Total Draws: ${total}`,``,
    ...sorted.map(([n,w],i)=>`${i+1}. ${n} — ${w} win${w!==1?'s':''}${w===maxWins?' 🏆':''}`)
  ];
  navigator.clipboard.writeText(lines.join('\n'))
    .then(()=>showToast('✅ Copied to clipboard'))
    .catch(()=>showToast('❌ Copy failed'));
};

$('btnScreenshot').onclick=()=>{
  if(!savedResults){showToast('Run a draw first');return;}
  showToast('📸 Use your device screenshot shortcut or Print → Save as PDF');
};

$('btnPDF').onclick=()=>{
  if(!savedResults){showToast('Run a draw first');return;}
  const{tally,names,total}=savedResults;
  const sorted=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  const maxWins=Math.max(...Object.values(tally));
  const topNames=sorted.filter(([,v])=>v===maxWins).map(([n])=>n).join(', ');
  const dateStr=new Date().toLocaleString();

  const rows=sorted.map(([n,w],i)=>`
    <tr style="${w===maxWins?'background:#fff9e6;font-weight:600':''}">
      <td style="padding:8px 12px;border-bottom:1px solid #eee">${i+1}</td>
      <td style="padding:8px 12px;border-bottom:1px solid #eee">${n}</td>
      <td style="padding:8px 12px;border-bottom:1px solid #eee;text-align:center">${w}</td>
      <td style="padding:8px 12px;border-bottom:1px solid #eee;text-align:center">${total>0?((w/total)*100).toFixed(1):0}%</td>
      <td style="padding:8px 12px;border-bottom:1px solid #eee;text-align:center">${w===maxWins?'🏆':''}</td>
    </tr>`).join('');

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>Lucky Draw Results</title>
  <style>body{font-family:sans-serif;padding:32px;max-width:600px;margin:auto;}
  h1{font-size:28px;margin-bottom:4px}
  .sub{color:#888;font-size:13px;margin-bottom:24px}
  .winner-box{background:#fffbe6;border:2px solid #F5C842;border-radius:10px;padding:16px 20px;margin-bottom:24px}
  .wl{font-size:11px;letter-spacing:2px;color:#C8A000;text-transform:uppercase}
  .wn{font-size:26px;font-weight:700;margin-top:4px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:#f5f5f5;padding:8px 12px;text-align:left;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#888}
  @media print{body{padding:16px}}</style></head>
  <body>
  <h1>🎲 Lucky Draw Results</h1>
  <div class="sub">Generated: ${dateStr} · ${names.length} participants · ${total} draws</div>
  <div class="winner-box"><div class="wl">🏆 Most Drawn</div><div class="wn">${topNames}</div></div>
  <table><thead><tr><th>#</th><th>Name</th><th>Wins</th><th>%</th><th></th></tr></thead>
  <tbody>${rows}</tbody></table>
  <script>window.onload=()=>{window.print();}<\/script>
  </body></html>`;

  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const win=window.open(url,'_blank');
  if(!win)showToast('Allow popups to download PDF');
  setTimeout(()=>URL.revokeObjectURL(url),10000);
};

/* ════════════════════════════════════════
   HISTORY
════════════════════════════════════════ */
function loadHistory(){return JSON.parse(localStorage.getItem('ld_history')||'[]');}
function saveHistory(entry){
  const h=loadHistory();
  h.unshift({...entry,id:Date.now()});
  if(h.length>50)h.length=50;
  localStorage.setItem('ld_history',JSON.stringify(h));
  renderHistory();
}
function renderHistory(){
  const h=loadHistory();
  const list=$('histList');
  if(!h.length){
    list.innerHTML='<div class="history-empty">No draws yet. Run your first lucky draw!</div>';
    return;
  }
  list.innerHTML='';
  h.forEach((e,i)=>{
    const d=new Date(e.date);
    const dateStr=d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
    const timeStr=d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
    const row=document.createElement('div');
    row.className='hist-item';
    row.innerHTML=`
      <div class="hist-num">${h.length-i}</div>
      <div class="hist-info">
        <div class="hist-winner">🏆 ${e.winner}</div>
        <div class="hist-meta">${dateStr} · ${timeStr} · ${e.participants} participants · ${e.draws} draws</div>
      </div>
      <div class="hist-badge">${e.draws}×</div>`;
    list.appendChild(row);
  });
}
$('clearHistBtn').onclick=()=>{
  if(!loadHistory().length)return;
  if(confirm('Clear all draw history?')){
    localStorage.removeItem('ld_history');
    renderHistory();
    showToast('🗑️ History cleared');
  }
};
renderHistory();

/* ════════════════════════════════════════
   RUN / RESET
════════════════════════════════════════ */
$('runBtn').onclick=async()=>{
  getAC(); vibrateSafe(40);
  const names=[...namesList.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean);
  if(names.length<2){
    const e=$('errMsg');e.textContent='Please enter at least 2 names.';
    e.style.display='block';setTimeout(()=>e.style.display='none',3500);return;
  }
  $('errMsg').style.display='none';
  $('resultsCard').style.display='none';
  $('runBtn').disabled=true;
  await runDraw(names,drawCount);
  $('runBtn').disabled=false;
};

$('resetBtn').onclick=()=>{
  $('resultsCard').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
};
</script>
</body>
</html>
